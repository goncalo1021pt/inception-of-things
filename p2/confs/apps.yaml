# App 1 — 1 replica
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app1-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app1-html
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>App 1</title></head>
    <body style="background:#000;display:flex;justify-content:center;align-items:center;height:100vh;margin:0">
      <h1 style="color:#FF4500;font-size:10rem;font-family:sans-serif">App 1</h1>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: svc-app1
spec:
  selector:
    app: app1
  ports:
    - port: 80
      targetPort: 80
---
